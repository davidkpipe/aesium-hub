document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:flex; align-items:center; justify-content:center; font-size:14px;\">{{ playIcon }}<\u002Fbutton>\n        <button onclick=\"{{ onNext }}\" style=\"background:none; border:none; cursor:pointer; color:#cbbfa8; font-size:14px;\">⏭<\u002Fbutton>\n        <div class=\"r-hide\" style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8175; width:38px; text-align:right;\">{{ timeNow }}<\u002Fdiv>\n        <div onclick=\"{{ onSeek }}\" class=\"r-hide\" style=\"flex:1; height:34px; display:flex; align-items:center; gap:2px; cursor:pointer;\">\n          <sc-for list=\"{{ bars }}\" as=\"b\" hint-placeholder-count=\"60\">\n            <div style=\"flex:1; height:{{ b.h }}; background:{{ b.color }}; border-radius:1px; min-width:1px;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div class=\"r-hide\" style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8175; width:38px;\">{{ timeTotal }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"r-hide\" style=\"display:flex; align-items:center; gap:10px; justify-content:flex-end;\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:9px; letter-spacing:.1em; color:#8a8175;\">VOL<\u002Fspan>\n        <div onclick=\"{{ onVol }}\" style=\"width:90px; height:4px; background:#2c241d; border-radius:3px; cursor:pointer; position:relative;\"><div style=\"position:absolute; left:0; top:0; bottom:0; width:{{ volPct }}; background:#cbbfa8; border-radius:3px;\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ CART PANEL ============ -->\n  <sc-if value=\"{{ cartOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCloseCart }}\" style=\"position:fixed; inset:0; z-index:60; background:rgba(23,18,14,.42); backdrop-filter:blur(2px);\"><\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ cartOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <aside class=\"av-scroll\" style=\"position:fixed; top:0; right:0; bottom:0; \u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:22px 24px; border-top:1px solid #231c15;\">\n        <div style=\"display:flex; justify-content:space-between; margin-bottom:16px;\"><span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.1em; color:#8a8175;\">SUBTOTAL<\u002Fspan><span style=\"font-family:'Space Mono',monospace; font-size:14px;\">{{ cartTotal }}<\u002Fspan><\u002Fdiv>\n        <button style=\"width:100%; background:#c8762f; color:#17120e; border:none; cursor:pointer; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.1em; padding:14px; border-radius:3px;\">CHECKOUT →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fsc-if>\n\n  <!-- ============ SEARCH OVERLAY ============ -->\n  <sc-if value=\"{{ searchOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ onCloseSearch }}\" style=\"position:fixed; inset:0; z-index:60; background:rgba(23,18,14,.55); backdrop-filter:blur(6px); display:flex; align-items:flex-start; justify-content:center; padding-top:14vh;\">\n      <div onclick=\"{{ stop }}\" style=\"width:560px; max-width:90vw; background:#fbf9ef; border-radius:5px; overflow:hidden; border:1px solid #231c15;\">\n        <input autofocus=\"\" placeholder=\"Search uploads, artists, series, records…\" style=\"width:100%; border:none; outline:none; background:#fbf9ef; padding:24px 26px; font-family:'Hanken Grotesk',sans-serif; font-size:20px; color:#1d1813;\">\n        <div style=\"padding:8px 26px 22px; border-top:1px solid #231c15;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.12em; color:#b3a895; margin:14px 0 10px;\">SUGGESTED<\u002Fdiv>\n          <sc-for list=\"{{ searchSuggest }}\" as=\"sg\" hint-placeholder-count=\"4\">\n            <div onclick=\"{{ sg.onClick }}\" style=\"display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #ece5d6; cursor:pointer;\" style-hover=\"color:#c8762f;\">\n              <span style=\"font-size:14px;\">{{ sg.label }}<\u002Fspan>\n              <span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b3a895;\">{{ sg.kind }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    const P = { clay:'#b9774f', sand:'#cdbfa3', olive:'#7d7a55', terra:'#b0633f', ecru:'#d9cdb5', slate:'#5f6357' };\n    const pc = [P.clay,P.sand,P.olive,P.terra,P.ecru,P.slate];\n    const tags = ['IN-HOUSE','GUEST TAKEOVER','SERIES'];\n    const durs = ['58:12','42:30','61:48','37:05','52:19','46:51','64:22','39:40'];\n    this.uploads = Array.from({length:8},(_,i)=>({\n      id:i, title:`Programme Title 0${i+1}`,\n      host:(i%3===1?`Guest 0${i+1}`:`Resident 0${(i%6)+1}`),\n      tag:tags[i%3], dur:durs[i], color:pc[i%6],\n      plays:`${(12.4-i*0.9).toFixed(1)}k`, time:`${(6+i*2)%24}`.padStart(2,'0')+':00'\n    }));\n    this.residents = Array.from({length:6},(_,i)=>({ id:i, name:`Resident 0${i+1}`, city:['London','Lisbon','Lagos','Berlin','Mexico City','Tokyo'][i], color:pc[i] }));\n    this.series = [\n      {title:'Series Title 01', desc:'A slow-listening study of late-night rooms and the records that hold them.', eps:'08', color:P.terra},\n      {title:'Series Title 02', desc:'Conversations with makers on craft, patience and the space to create.', eps:'05', color:P.olive},\n      {title:'Series Title 03', desc:'Field recordings and dust — a sound diary across three cities.', eps:'06', color:P.sand},\n    ];\n    this.artist = {\n      name:'Artist Name', role:'IN-HOUSE RESIDENT', loc:'London / UK',\n      spotlight:'New residency mix — warm, unhurried, built to live in.',\n      standfirst:'Eight years into a quiet practice, the resident talks rooms, rhythm and the long patience of making something that lasts — recorded between sessions at the house.',\n      releases:'08', followers:'—', since:'2019',\n      quote:'I am not chasing the loud thing. I am chasing the true thing — and it usually arrives slowly, in a warm room, late.',\n      bio:['Placeholder biography paragraph one — the resident moved through the house slowly, building a body of work out of patience and small rooms. The mixes carry that same unhurried weight: space to breathe, space to create.',\n           'Placeholder biography paragraph two — across releases and live appearances the work keeps returning to texture and warmth, to music in motion rather than music on display. This is the long quiet of making something true.']\n    };\n    this.videos = Array.from({length:5},(_,i)=>({\n      id:i, title:`Video Title 0${i+1}`, host:`Resident 0${(i%6)+1}`,\n      cat:['SESSION','INTERVIEW','EVENT RECORDING','SESSION','INTERVIEW'][i],\n      dur:['12:40','28:15','41:02','09:55','33:18'][i], color:pc[(i+2)%6]\n    }));\n    this.events = [\n      {id:0, title:'Event Title 01', venue:'The House', city:'London', lineup:'Resident 01 · Guest 02 · Resident 04', date:'JUL 12', time:'21:00', status:'TICKETS', up:true},\n      {id:1, title:'Event Title 02', venue:'Warehouse 9', city:'Berlin', lineup:'Resident 03 · Guest 01', date:'JUL 26', time:'22:00', status:'TICKETS', up:true},\n      {id:2, title:'Event Title 03', venue:'Rooftop Series', city:'Lisbon', lineup:'Series Title 02 live', date:'AUG 09', time:'19:30', status:'RSVP', up:true},\n      {id:3, title:'Event Title 04', venue:'Basement', city:'Lagos', lineup:'Resident 05 · Resident 06', date:'MAY 30', time:'—', status:'PAST', up:false},\n      {id:4, title:'Event Title 05', venue:'The House', city:'London', lineup:'Guest 03 takeover', date:'MAY 11', time:'—', status:'PAST', up:false},\n      {id:5, title:'Event Title 06', venue:'Studio Floor', city:'Tokyo', lineup:'Resident 02', date:'APR 24', time:'—', status:'PAST', up:false},\n    ];\n    const cats=['VINYL','MERCH','APPAREL','PRINT','CASSETTE','VINYL','MERCH','PRINT'];\n    const fmts=['12\" LP','HEAVY TEE','CREW HOOD','A2 GICLÉE','C60 TAPE','2×LP','TOTE','RISO PRINT'];\n    const labels=['VINYL','MERCH','MERCH','PRINT','VINYL','VINYL','MERCH','PRINT'];\n    this.products = Array.from({length:8},(_,i)=>({\n      id:i, title:`Product Title 0${i+1}`,\n      artist:(i%2===0?'Artist Name':'Aesium Label'),\n      cat:cats[i], format:fmts[i], price:`£${[32,28,46,40,18,52,22,36][i]}`,\n      priceN:[32,28,46,40,18,52,22,36][i], color:pc[(i+3)%6], label:labels[i]\n    }));\n    const aRoles=['IN-HOUSE','GUEST','SERIES'];\n    const aCities=['London','Lisbon','Lagos','Berlin','Mexico City','Tokyo','Paris','New York','Seoul','Amsterdam','Bristol','Oslo'];\n    this.artists=Array.from({length:12},(_,i)=>({ id:i, name:`Artist ${String(i+1).padStart(2,'0')}`, role:aRoles[i%3], city:aCities[i%aCities.length], color:pc[i%6] }));\n    const eCats=['GUEST MIX','INTERVIEW','BEHIND THE SCENES','LIVE SESSION','MUSIC VIDEO','EVENT RECORDING','GUEST MIX','OTHER'];\n    const eTitles=['Guest Mix — Late Room Session','In Conversation: On Patience & Craft','Inside the House — Studio Diary','Live at the House — Full Set','Warm Room, Late — Official Video','Rooftop Series — Closing Set','Aesium Sessions Vol. 04','Aesium Feature — Year in Review'];\n    const eDurs=['58:12','24:30','11:48','47:05','04:19','52:51','61:22','08:40'];\n    this.experiences=Array.from({length:8},(_,i)=>({ cat:eCats[i], title:eTitles[i], dur:eDurs[i], color:pc[(i+1)%6] }));\n    this.wave = Array.from({length:64},(_,i)=> Math.min(1, Math.abs(Math.sin(i*0.5)*0.55 + Math.sin(i*0.17+1)*0.35 + Math.sin(i*1.1)*0.18)*0.85+0.18));\n    this.state = { page:'home', variant:'A', current:0, playing:false, progress:0, volume:72,\n      cart:[], cartOpen:false, searchOpen:false, menuOpen:false, watch .wave.map((h,i)=>{ const played=(i/this.wave.length*100)<=S.progress; return { h:Math.round(h*100)+'%', color:played?accent:'#3a322a', colorLight:played?accent:'#231c15' }; });\n    const onSeek=(e)=>{ const r=e.currentTarget.getBoundingClientRect(); this.setState({progress:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)), playing:true}); };\n    const onVol=(e)=>{ const r=e.currentTarget.getBoundingClientRect(); this.setState({volume:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))}); };\n    // cart\n    const counts={}; S.cart.forEach(id=>counts[id]=(counts[id]||0)+1);\n    const cartItems=Object.keys(counts).map(id=>{ const p=this.products[id]; return {title:p.title, cat:p.cat, qty:counts[id], price:p.price, color:p.color, onRemove:()=>this.removeCart(Number(id))}; });\n    const totalN=S.cart.reduce((a,id)=>a+this.products[id].priceN,0);\n    // uploads (home rail / index)\n    const uploads=this.uploads.map((u,i)=>({...u, tagHost:`${u.tag} · ${u.host}`, onPlay:()=>this.play(i), onOpen:()=>this.openDetail(i)}));\n    const takeovers=this.uploads.filter(u=>u.tag!=='IN-HOUSE').slice(0,5).map(u=>({title:u.title, tag:`${u.tag} · ${u.host}`, dur:u.dur, onPlay:()=>this.play(u.id)}));\n    const residents=this.residents.map(r=>({...r, onClick:()=>this.go('artist')}));\n    // detail\n    const d=this.uploads[S.detailId];\n    const tracklist=Array.from({length:9},(_,i)=>({n:String(i+1).padStart(2,'0'), title:`Track Reference ${i+1}`, artist:`Artist 0${(i%6)+1}`, t:`0${(i%6)+1}:${String((i*7)%60).padStart(2,'0')}`}));\n    const related=this.uploads.filter(u=>u.id!==S.detailId).slice(0,4).map(u=>({...u, onOpen:()=>this.openDetail(u.id)}));\n    const hashtags=['#warm','#latenight','#residency','#inhouse','#analog','#slowlistening'];\n    const accordions=[\n      {q:'Format & runtime', a:`Continuous mix — ${d.dur}. Recorded at the house, single take.`},\n      {q:'Licensing', a:'Placeholder note on rights and clearances for broadcast and re-upload.'},\n
